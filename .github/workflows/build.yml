name: Build V2 APK + Verify

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        shell: bash
        run: |
          rm -rf project
          mkdir project
          unzip -q BuildFirstV2_project.zip -d project

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK identity and permissions
        shell: bash
        run: |
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo "===== APK SHA-256 ====="
          sha256sum "$APK"

          echo "===== PACKAGE / VERSION / SDK ====="
          "$AAPT" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^application-label:"

          echo "===== REQUESTED PERMISSIONS ====="
          PERMS="$("$AAPT" dump permissions "$APK" | grep "uses-permission" || true)"
          if [ -z "$PERMS" ]; then
            echo "NO REQUESTED PERMISSIONS"
          else
            echo "$PERMS"
          fi

          echo "===== SIGNING CERTIFICATE ====="
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: BuildFirstV2-verified
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
